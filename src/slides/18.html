<section class="slide" data-part="Investimento">
  <div class="hd">
    <span class="eyebrow" data-a><i>(17)</i> Investimento</span>
    <h2 class="sm" data-a style="--d:1">Quanto custa<br>cada <em>caminho</em>.</h2>
  </div>
  <div class="mid">
    <div class="iv" id="iv">
      <div class="iv-ctl" data-a style="--d:2">
        <div class="iv-top">
          <div class="seg" id="ivQ"><button data-q="25">25 totens</button><button class="sel" data-q="50">50 totens</button></div>
          <div class="seg" id="ivS"><button data-k="0">Essencial</button><button class="sel" data-k="1">Intermediário</button><button data-k="2">Interativo</button></div>
        </div>
        <div class="iv-cmp" id="ivCmpBox">
          <span class="mono">Total em 36 meses</span>
          <div id="ivCmp"></div>
        </div>
        <div class="iv-lines" id="ivLines"></div>
        <button class="chip iv-tg" id="ivTg">Ver itens</button>
      </div>
      <div class="iv-out" data-a style="--d:3">
        <div class="iv-big"><small>Por totem</small><b id="ivPer" class="tnum"></b></div>
        <div class="iv-row">
          <div><small>Implantação</small><b id="ivTot" class="tnum"></b></div>
          <div><small>Por mês</small><b id="ivMes" class="tnum"></b></div>
        </div>
      </div>
    </div>
  </div>
  <p class="note" data-a>Estimativa com kit reserva de 10%, sem o móvel da NEOBAND. Preço de tela fecha na cotação formal.</p>
</section>
