<section class="slide dark" data-part="Tecnologia">
  <div class="hd">
    <span class="eyebrow" data-a><i>(06)</i> Rede e energia</span>
    <h2 class="sm" data-a style="--d:1">Ninguém na loja<br>aperta <em>botão</em>.</h2>
  </div>
  <div class="mid">
    <div class="ne">
      <div class="ne-fig" data-a style="--d:2">
        <svg viewBox="0 0 900 400" id="neSvg" aria-label="Energia e rede do totem">
          <g class="ne-links">
            <path id="lkE1" d="M110 320 H200"/><path id="lkE2" d="M290 320 H430"/><path id="lkE3" d="M500 290 V260"/>
            <path id="lkN1" d="M760 80 V150"/><path id="lkN2" d="M690 195 H590"/><path id="lkN3" d="M500 100 V150"/>
          </g>
          <g class="ne-nodes">
            <g class="nd" id="ndTom"><rect x="20" y="290" width="90" height="60"/><text x="65" y="318">Tomada</text><text x="65" y="334" class="s">da loja</text></g>
            <g class="nd" id="ndFon"><rect x="200" y="290" width="90" height="60"/><text x="245" y="318">Fonte</text><text x="245" y="334" class="s">da tela</text></g>
            <g class="nd" id="ndBat"><rect x="430" y="290" width="140" height="60"/><text x="500" y="318">Bateria</text><text x="500" y="334" class="s">interna · 10.000 mAh</text></g>
            <g class="nd big" id="ndTot"><rect x="410" y="150" width="180" height="110"/><text x="500" y="192">Totem</text><text x="500" y="212" class="s">tela touch + Android</text><text x="500" y="232" class="s" id="ndTotS">tocando</text></g>
            <g class="nd" id="ndWifi"><rect x="690" y="155" width="140" height="80"/><text x="760" y="190">Wi-Fi</text><text x="760" y="208" class="s">da loja</text></g>
            <g class="nd" id="ndCld"><rect x="690" y="10" width="140" height="70"/><text x="760" y="40">Nuvem</text><text x="760" y="58" class="s">software 75 LAB</text></g>
            <g class="nd" id="ndCache"><rect x="420" y="40" width="160" height="60"/><text x="500" y="68">Mídia salva</text><text x="500" y="84" class="s">na própria tela</text></g>
          </g>
        </svg>
        <div class="ne-btns" id="neBtns">
          <span class="mono">Simular</span>
          <button data-k="0">Cai a internet</button>
          <button data-k="1">Cai a energia</button>
          <button data-k="2">A tela trava</button>
          <button data-k="3">Loja fecha</button>
        </div>
      </div>
      <div class="ne-log" data-a style="--d:3">
        <span class="mono" id="neTitle">Escolha uma falha</span>
        <ol id="neLog"><li class="idle">Clique numa falha.</li></ol>
      </div>
    </div>
  </div>
</section>
